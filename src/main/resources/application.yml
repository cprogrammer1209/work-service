spring:
  application:
    name: work-service
  # Postgres comes from the root compose.yaml (docker compose up -d); this service has its own database.
  datasource:
    url: jdbc:postgresql://localhost:5432/work
    username: projecty
    password: projecty
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      # Redis is an optimisation, so a slow or missing server must not hold requests up.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: work-service
      # A new Work database reads all of Platform's member events from the start, including the backfill.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Redis is allowed to be down (the app falls back to the database), so it must not turn /actuator/health red.
management:
  health:
    redis:
      enabled: false

server:
  port: 8082

projecty:
  cors:
    allowed-origins: "http://localhost:4200"
  token:
    issuer: http://localhost:8081
    audience: projecty-api
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  outbox:
    poll-interval: 1s
    batch-size: 100
    relay-enabled: true
    retention: 7d
    purge-interval: 1h
  redis:
    type: redis # "memory" keeps everything in this process
    access-ttl: 60s # safety net for the membership cache; member events also evict it at once
    definitions-ttl: 10m # custom field, layout and status definitions; a change bumps the portal's version
    response-ttl: 60s # cached API responses and lookups; a change moves their version key, this is the safety net
    backoff: 10s # after a failed call Redis is left alone this long, so an outage costs one timeout, not one per call
  broker:
    type: kafka
    send-timeout: 5s
    partitions: 3
    topics:
      - projecty.project
      - projecty.field
      - projecty.layout
      - projecty.task
      - projecty.tasklist
